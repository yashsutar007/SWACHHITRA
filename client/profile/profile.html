<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SWACHHITRA User Profile Setup"
    >

    <title>SWACHHITRA | Complete Profile</title>

    <link
        rel="stylesheet"
        href="./profile.css"
    >
</head>

<body>

    <main class="profile-page">

        <!-- Decorative background -->
        <div class="background-orb orb-one"></div>
        <div class="background-orb orb-two"></div>
        <div class="background-grid"></div>


        <section class="profile-wrapper">

            <!-- Top Brand -->

            <div class="brand-bar">

                <div class="brand">

                <div class="brand-header">
                    <img
                        src="/assets/LOGO(1).png"
                        alt="SWACHHITRA Logo"
                        class="brand-logo"
                    >
                </div>

                    <div>

                        <h1>SWACHHITRA</h1>

                        <p>
                            Smart Waste Collection & Route Optimization System
                        </p>

                    </div>

                </div>


                <button
                    type="button"
                    id="backButton"
                    class="back-button"
                >

                    <span>←</span>

                    Back to Login

                </button>

            </div>



            <!-- Main Profile Card -->

            <section class="profile-card">

                <div class="profile-header">

                    <div class="header-top">

                        <div>

                            <p class="eyebrow">
                                ACCOUNT SETUP
                            </p>


                            <h2 id="profileTitle">
                                Complete Your Profile
                            </h2>


                            <p
                                id="profileSubtitle"
                                class="profile-subtitle"
                            >
                                Add the required information
                                to continue.
                            </p>

                        </div>


                        <div class="profile-symbol">

                            <span id="roleInitial">
                                U
                            </span>

                        </div>

                    </div>



                    <div class="role-strip">

                        <div class="role-info">

                            <span class="role-dot"></span>

                            <span>
                                Selected Account Type
                            </span>

                        </div>


                        <span
                            id="selectedRole"
                            class="role-badge"
                        >
                            User
                        </span>

                    </div>

                </div>



                <!-- Form -->

                <form
                    id="profileForm"
                    novalidate
                >

                    <div
                        id="profileFields"
                        class="profile-fields"
                    >
                    </div>


                    <div
                        id="profileMessage"
                        class="profile-message"
                        aria-live="polite"
                    >
                    </div>


                    <div class="form-footer">

                        <p class="required-note">

                            <span>*</span>

                            Required fields

                        </p>


                        <button
                            type="submit"
                            id="submitButton"
                            class="submit-button"
                        >

                            <span id="submitText">
                                Complete Profile
                            </span>

                            <span class="button-arrow">
                                →
                            </span>

                        </button>

                    </div>

                </form>

            </section>



            <p class="page-footer">

                SWACHHITRA

                <span>•</span>

                Smarter Routes. Cleaner Cities.

            </p>

        </section>

    </main>


    <script src="./profile.js"></script>

</body>

</html>
